name: Release

# Triggers when you push a version tag: git tag v1.0.1 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned; move to a newer image deliberately

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          # Create a clean temp directory with the plugin folder name
          mkdir -p /tmp/build/availability-calendar-for-beds24

          # Copy only distributable files — exclude all dev/tooling files
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='.claude' \
            --exclude='.stylelintrc.json' \
            --exclude='CLAUDE.md' \
            --exclude='ELEMENTOR_WIDGET_GUIDE.md' \
            --exclude='README.md' \
            --exclude='eslint.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules' \
            --exclude='phpcs.xml' \
            --exclude='phpstan.neon' \
            --exclude='vendor' \
            --exclude='*.zip' \
            . /tmp/build/availability-calendar-for-beds24/

          # Install runtime dependencies only (ships PUC in vendor/, no dev tools)
          composer install --no-dev --prefer-dist --no-progress --no-interaction \
            --working-dir=/tmp/build/availability-calendar-for-beds24

          # Remove composer manifests — not needed at runtime
          rm /tmp/build/availability-calendar-for-beds24/composer.json
          rm /tmp/build/availability-calendar-for-beds24/composer.lock

          # Inject the tag version — no manual version bump needed on each release
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^\( \* Version: *\).*/\1${VERSION}/" \
            /tmp/build/availability-calendar-for-beds24/availability-calendar-for-beds24.php
          sed -i "s/define( 'BAC_VERSION', '[^']*' );/define( 'BAC_VERSION', '${VERSION}' );/" \
            /tmp/build/availability-calendar-for-beds24/availability-calendar-for-beds24.php
          sed -i "s/^Stable tag:.*/Stable tag:         ${VERSION}/" \
            /tmp/build/availability-calendar-for-beds24/readme.txt

          # Create the zip from the temp directory
          cd /tmp/build
          zip -r availability-calendar-for-beds24-${{ steps.version.outputs.VERSION }}.zip \
            availability-calendar-for-beds24/

      - name: Smoke-test built ZIP
        run: |
          unzip -q /tmp/build/availability-calendar-for-beds24-${{ steps.version.outputs.VERSION }}.zip \
            -d /tmp/smoke
          php -l /tmp/smoke/availability-calendar-for-beds24/availability-calendar-for-beds24.php
          grep -q "Plugin Name:" /tmp/smoke/availability-calendar-for-beds24/availability-calendar-for-beds24.php
          grep -q "Version:" /tmp/smoke/availability-calendar-for-beds24/availability-calendar-for-beds24.php
          echo "Smoke test passed"

      - name: Generate release notes from readme.txt
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo "## What's new in v${VERSION}"
            echo ""
            awk "/^= ${VERSION} =/{found=1;next} found && /^= /{exit} found && NF{print}" readme.txt
            echo ""
            echo "---"
            echo ""
            echo "**Installation:** Download the zip below and install via **WordPress Admin → Plugins → Add New → Upload Plugin**."
            echo ""
            echo "If you use [Git Updater](https://git-updater.com/), this release will be detected automatically."
          } > /tmp/release-notes.md

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Release v${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/release-notes.md
          files: /tmp/build/availability-calendar-for-beds24-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
